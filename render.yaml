services:
  - type: web
    name: inventory-manager
    runtime: node
    region: oregon
    plan: free
    buildCommand: |
      npm install -g pnpm &&
      pnpm install &&
      pnpm --filter @workspace/db run push &&
      node artifacts/api-server/build.mjs &&
      NODE_ENV=production pnpm --filter @workspace/inventory-manager run build
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString

databases:
  - name: inventory-db
    region: oregon
    plan: free
    databaseName: inventory
    user: inventory_user
